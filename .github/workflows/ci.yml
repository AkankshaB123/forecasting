name: Forecasting CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -e . pytest
      - name: Compile application and package
        run: python -m compileall -q app.py src tests
      - name: Run unit tests
        run: pytest
      - name: Smoke-test Streamlit startup
        run: |
          streamlit run app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true > /tmp/streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill "$STREAMLIT_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)" 2>/dev/null; then
              echo "Streamlit health endpoint responded."
              exit 0
            fi
            if ! kill -0 "$STREAMLIT_PID" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Build Docker image
        if: matrix.python-version == '3.11'
        run: docker build --tag forecasting-app:${{ github.sha }} .
